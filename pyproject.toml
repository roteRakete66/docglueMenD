[project]
name = "docgluemend"
version = "0.1.0"
description = "A CLI tool that extracts and aggregates inline code comments into structured Markdown files."
authors = [
    {name = "roteRakete66",email = "jens.fradrich@googlemail.com"}
]
readme = "README.md"
license = { text = "MIT" }
requires-python = "~=3.11.0"
dependencies = [
    "deep-translator (>=1.11.4,<2.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "requests (>=2.34.2,<3.0.0)",
]

[project.scripts]
docgluemend = "docgluemend.app:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
